version: '3.8'

services:
  web:
    image: gaurang81/expanzo:latest
    container_name: splitwise_web_prod
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    restart: always
    deploy:
      resources:
        limits:
          memory: 300M

  db:
    image: pgvector/pgvector:pg16
    container_name: splitwise_db_prod
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 200M

  redis:
    image: redis:7-alpine
    container_name: splitwise_redis_prod
    restart: always
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 50M

  worker:
    image: gaurang81/expanzo:latest
    container_name: splitwise_worker_prod
    command: celery -A config worker -l info --concurrency=1
    volumes:
      - media_volume:/app/media
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    env_file:
      - .env
    restart: always
    deploy:
      resources:
        limits:
          memory: 150M

  nginx:
    image: nginx:1.25-alpine
    container_name: splitwise_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    depends_on:
      - web

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
