<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1e293b; margin: 0; padding: 0; background-color: #f8fafc; }
        .wrapper { padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 24px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1); }
        .header { background: #1e293b; padding: 40px; text-align: center; color: white; }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 24px; display: block; text-decoration: none; color: white; }
        .icon-circle { width: 64px; height: 64px; background: rgba(255, 255, 255, 0.1); border-radius: 20px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .content { padding: 40px; text-align: center; }
        .title { font-size: 24px; font-weight: 700; color: #0f172a; margin: 0 0 12px; }
        .message { color: #64748b; font-size: 16px; margin-bottom: 32px; }
        .button { display: inline-block; padding: 16px 32px; background-color: #4f46e5; color: white !important; text-decoration: none; border-radius: 14px; font-weight: 600; font-size: 16px; transition: background-color 0.2s; }
        .footer { padding: 32px; background-color: #f8fafc; text-align: center; color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <a href="{{ site_url }}" class="logo">EXPENZO</a>
                <div class="icon-circle">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: white;"><path d="M17 6.1H3"/><path d="M21 12.1H3"/><path d="M15.1 18.1H3"/></svg>
                </div>
                <h2 style="margin:0; font-size: 28px;">Ownership Update</h2>
            </div>
            <div class="content">
                <h3 class="title">{{ notification_title }}</h3>
                <p class="message">{{ notification_message|safe }}</p>
                <div style="background-color: #f8fafc; border-radius: 16px; padding: 24px; margin-bottom: 32px; text-align: left;">
                    <p style="margin: 0; color: #475569; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Group Name</p>
                    <p style="margin: 4px 0 0; color: #1e293b; font-size: 18px; font-weight: 700;">{{ group_name }}</p>
                </div>
                <a href="{{ action_url }}" class="button">Access Group Settings</a>
            </div>
            <div class="footer">
                <p>© 2026 Expenzo. All rights reserved.</p>
                <p>Security & financial integrity are our top priorities.</p>
            </div>
        </div>
    </div>
</body>
</html>
