<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1e293b; margin: 0; padding: 0; background-color: #f8fafc; }
        .wrapper { padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 24px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1); }
        .header { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); padding: 40px; text-align: center; color: white; }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 24px; display: block; text-decoration: none; color: white; }
        .icon-circle { width: 64px; height: 64px; background: rgba(255, 255, 255, 0.2); border-radius: 20px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .content { padding: 40px; text-align: center; }
        .amount-badge { display: inline-block; padding: 12px 24px; background-color: #f1f5f9; border-radius: 16px; color: #0f172a; font-weight: 800; font-size: 32px; margin: 24px 0; }
        .title { font-size: 24px; font-weight: 700; color: #0f172a; margin: 0 0 12px; }
        .message { color: #64748b; font-size: 16px; margin-bottom: 32px; }
        .button { display: inline-block; padding: 16px 32px; background-color: #4f46e5; color: white !important; text-decoration: none; border-radius: 14px; font-weight: 600; font-size: 16px; transition: background-color 0.2s; }
        .footer { padding: 32px; background-color: #f8fafc; text-align: center; color: #94a3b8; font-size: 14px; }
        .divider { height: 1px; background-color: #e2e8f0; margin: 32px 0; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <a href="{{ site_url }}" class="logo">EXPENZO</a>
                <div class="icon-circle">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: white;"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <h2 style="margin:0; font-size: 28px;">New Expense Added</h2>
            </div>
            <div class="content">
                <h3 class="title">{{ expense_title }}</h3>
                <p class="message"><strong>{{ actor_name }}</strong> added a new expense to <strong>{{ group_name }}</strong>.</p>
                <div class="amount-badge">{{ amount }}</div>
                <p class="message" style="margin-bottom: 40px;">Check your updated balance and settle up whenever you're ready.</p>
                <a href="{{ action_url }}" class="button">View Expense Details</a>
            </div>
            <div class="footer">
                <p>© 2026 Expenzo. All rights reserved.</p>
                <p>Track. Split. Settle.</p>
            </div>
        </div>
    </div>
</body>
</html>
