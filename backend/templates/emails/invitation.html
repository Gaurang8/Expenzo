<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #334155; }
        .container { max-width: 600px; margin: 0 auto; padding: 40px; border: 1px solid #e2e8f0; border-radius: 16px; }
        .header { text-align: center; margin-bottom: 32px; }
        .logo { font-size: 24px; font-weight: bold; color: #4f46e5; text-decoration: none; }
        .content { margin-bottom: 32px; }
        .button { 
            display: inline-block; 
            padding: 14px 28px; 
            background-color: #4f46e5; 
            color: #ffffff !important; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: bold;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.1), 0 2px 4px -1px rgba(79, 70, 229, 0.06);
        }
        .footer { font-size: 14px; color: #94a3b8; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Expenzo</div>
        </div>
        <div class="content">
            <h2>You've been invited!</h2>
            <p>Hi there,</p>
            <p><strong>{{ inviter_name }}</strong> has invited you to join the group <strong>"{{ group_name }}"</strong> on Expenzo.</p>
            <p>Simplify your group expenses and stay settled up.</p>
            <div style="text-align: center; margin-top: 40px;">
                <a href="{{ action_url }}" class="button">Join Group</a>
            </div>
        </div>
        <div class="footer">
            <p>If you don't have an account, you'll be prompted to create one.</p>
            <p>&copy; 2026 Expenzo. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
