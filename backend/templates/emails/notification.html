<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #334155; margin: 0; padding: 0; }
        .wrapper { background-color: #f8fafc; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 40px; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .logo { font-size: 28px; font-weight: 800; color: #4f46e5; text-decoration: none; margin-bottom: 30px; display: block; text-align: center; }
        .title { font-size: 22px; font-weight: 700; color: #1e293b; margin-bottom: 20px; text-align: center; }
        .message { font-size: 16px; color: #475569; margin-bottom: 35px; line-height: 1.8; text-align: center; }
        .footer { font-size: 13px; color: #94a3b8; text-align: center; margin-top: 40px; border-top: 1px solid #f1f5f9; padding-top: 20px; }
        .button-container { text-align: center; margin-top: 30px; }
        .button { 
            display: inline-block; 
            padding: 14px 32px; 
            background-color: #4f46e5; 
            color: #ffffff !important; 
            text-decoration: none; 
            border-radius: 14px; 
            font-weight: bold;
            font-size: 15px;
            letter-spacing: -0.01em;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <a href="{{ site_url }}" class="logo">Expenzo</a>
            <h1 class="title">{{ title }}</h1>
            <div class="message">
                {{ message|safe }}
            </div>
            {% if action_url %}
            <div class="button-container">
                <a href="{{ action_url }}" class="button">View Details</a>
            </div>
            {% endif %}
            <div class="footer">
                <p>&copy; 2026 Expenzo. All rights reserved.</p>
                <p>You received this because you are a member of an Expenzo group.</p>
            </div>
        </div>
    </div>
</body>
</html>
